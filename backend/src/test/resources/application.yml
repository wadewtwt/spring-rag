app:
  rag:
    embedding:
      mode: simple
    retrieval:
      top-k: 3
      min-score: 0.15
      max-retries: 1
    llm:
      enabled: false
      provider: dashscope
      model: qwen-plus
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    store:
      mode: inmemory
      chroma:
        api-version: v2
