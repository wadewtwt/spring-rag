spring:
  datasource:
    url: jdbc:h2:mem:springrag;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  rag:
    embedding:
      mode: simple
    retrieval:
      top-k: 3
      min-score: 0.15
      max-retries: 1
    llm:
      enabled: false
      provider: dashscope
      model: qwen-plus
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    store:
      mode: inmemory
      chroma:
        api-version: v2
