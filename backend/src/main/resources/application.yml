spring:
  application:
    name: spring-rag-backend
server:
  port: 8089
app:
  rag:
    embedding:
      mode: local
    retrieval:
      top-k: 3
      min-score: 0.15
      max-retries: 1
    llm:
      enabled: false
      provider: dashscope
      model: qwen-plus
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      temperature: 0.2
      timeout-seconds: 30
    store:
      mode: inmemory
      chroma:
        base-url: http://localhost:8000
        api-version: v2
        tenant: default_tenant
        database: default_database
        collection: spring-rag
